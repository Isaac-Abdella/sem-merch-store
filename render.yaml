# Render Blueprint: one web service that builds the React client and serves it from the Express API.
# Deploy: Render dashboard → New → Blueprint → pick this repo. Values marked sync: false are prompted for.
services:
  - type: web
    name: sem-merch-store
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci --prefix server --omit=dev && npm ci --prefix client --include=dev && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: STRICT_LOGIN_GEOFENCE
        value: "false"
      - key: GEOCODER
        value: nominatim
      - key: GEOCODER_USER_AGENT
        sync: false
      - key: PAYMENT_PROVIDER
        value: stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STORE_NAME
        value: SEM Merch
      - key: SMS_PROVIDER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: UBER_DIRECT_ENABLED
        value: "false"
      - key: UBER_DIRECT_MODE
        value: live
      - key: UBER_CUSTOMER_ID
        sync: false
      - key: UBER_CLIENT_ID
        sync: false
      - key: UBER_CLIENT_SECRET
        sync: false
      - key: UBER_WEBHOOK_SIGNING_KEY
        sync: false
      - key: UBER_PICKUP_PHONE
        sync: false
      - key: UBER_PICKUP_LINE1
        sync: false
      - key: UBER_PICKUP_POSTAL_CODE
        sync: false
      - key: UBER_PICKUP_LAT
        sync: false
      - key: UBER_PICKUP_LNG
        sync: false
      - key: CANADA_POST_ENABLED
        value: "false"
      - key: CP_TOKEN_URL
        sync: false
      - key: CP_TOKEN_SCOPE
        sync: false
      - key: CP_API_KEY
        sync: false
      - key: CP_API_SECRET
        sync: false
      # Free web services sleep when idle, so in-process polling is unreliable there.
      # Prefer the cron job below (paid) or set this > 0 on an always-on instance.
      - key: CARRIER_POLL_MINUTES
        value: "0"
      # Read by Vite at build time, so it must be set before the build runs.
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false

  # Optional (paid): checks Canada Post tracking every 30 minutes and texts customers on changes.
  # Uncomment after CANADA_POST_ENABLED=true. Copy MONGO_URI, Twilio and CP_* values into it too.
  # - type: cron
